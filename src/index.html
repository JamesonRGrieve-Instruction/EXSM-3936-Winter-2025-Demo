<!DOCTYPE html>
<html lang="en-CA">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Website</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main>
        <input id="searchTodos" type="text" placeholder="Search todos" />
        <section>
            <h2>Pending Todos</h2>
            <button id="sortPendingTodosAlpha">Sort Alphabetically</button>
            <button id="sortPendingTodosChrono">Sort Chronologically</button>
            <ul id="pendingTodos">

            </ul>
        </section>
        <section>
            <h2>Completed Todos</h2>
            <button id="sortCompletedTodosAlpha">Sort Alphabetically</button>
            <button id="sortCompletedTodosChrono">Sort Chronologically (Added)</button>
            <button id="sortCompletedTodosChronoCompleted">Sort Chronologically (Completed)</button>
            <ul id="completedTodos">

            </ul>
            <button id="clearCompletedTodos">Clear Completed Todos</button>
        </section>
        <input id="todoBody" type="text" placeholder="Enter a todo" />
        <input id="todoThumb" type="text" placeholder="Enter a thumbnail URL" />
        <button id="addTodo">Add Todo</button>
    </main>
    <script src="js/scripts.js" defer></script>
</body>

</html>
